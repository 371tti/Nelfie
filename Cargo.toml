[package]
name = "nelfie"
version = "0.1.13"
edition = "2024"

[dependencies]
env_logger = "0.11"
tokio = { version = "1", features = [
    "fs",
    "macros",
    "io-util",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
async-trait = "0.1.89"
base64 = "0.22"
async-openai = { version = "0.34", features = ["responses"] }
tiktoken-rs = "0.12.1"
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "rustls_backend", # native-tls じゃなく rustls を使う
    "model",
] }
serenity-reqwest = { package = "reqwest", version = "0.12.28", default-features = false, features = [
    "rustls-tls",
] }

# コマンドフレームワーク
poise = "0.6"
log = "0.4.28"
serde_json = "1.0"
serde = "1.0.228"
dashmap = "6.1.0"
dotenv = "0.15.0"
chrono = "0.4.44"
chrono-tz = "0.10.4"
flate2 = "1"
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "rustls",
] }
tar = "0.4"
ratex-layout = "0.1.10"
ratex-parser = "0.1.10"
ratex-svg = "0.1.10"
ratex-types = "0.1.10"
resvg = "0.47.0"
# Temporary: use unreleased DAVE/E2EE support from songbird `next`.
songbird = { git = "https://github.com/serenity-rs/songbird", branch = "next", features = [
    "serenity",
    "builtin-queue",
    "rustls",
] }
rustls = { version = "0.23.37", features = ["aws_lc_rs"] }
voicevox_core = { git = "https://github.com/VOICEVOX/voicevox_core", package = "voicevox_core", rev = "740f2defce4b27fb6b8afe3282597fa5ca2b01bb", features = [
    "load-onnxruntime",
    "buildtime-download-onnxruntime",
] }
regex = "1.12.3"
once_cell = "1.21.4"
tempfile = "3"
kanalizer = { git = "https://github.com/VOICEVOX/kanalizer.git", package = "kanalizer" }

[profile.release]
opt-level = 3
lto = "fat"
# codegen-units = 1
